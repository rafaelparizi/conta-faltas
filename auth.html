<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>presente.edu - Acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .bg-iffar {
            background-color: #32a041;
        }

        .text-iffar {
            color: #32a041;
        }

        .beta-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }
    </style>
    <script>
        // v1: sem OAuth real. Se o usuário já "entrou" antes, pula o login.
        if (localStorage.getItem('presente_auth') === '1') {
            location.replace('presente.html');
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center px-6 py-12">

    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="flex items-center justify-center space-x-3 mb-8">
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="20" width="25" height="25" fill="#32a041" />
                <rect x="55" y="20" width="25" height="25" fill="#32a041" />
                <rect x="20" y="55" width="25" height="25" fill="#32a041" />
                <circle cx="67.5" cy="67.5" r="12.5" fill="#e31e24" />
            </svg>
            <div>
                <span class="font-bold text-xl block leading-none">presente.edu</span>
                <span class="text-xs text-gray-500">Coordenação de Curso</span>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-8 text-center">
            <div class="mb-4">
                <span class="beta-badge italic">VERSÃO BETA EM TESTES</span>
            </div>

            <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Acesse sua conta</h1>
            <p class="text-sm text-gray-600 mb-8">
                Entre para transformar os diários do SIGAA em indicadores de frequência e evasão.
            </p>

            <button id="btn-google" type="button"
                class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg px-4 py-3 font-semibold text-gray-700 hover:bg-gray-50 hover:shadow-sm transition">
                <svg class="w-5 h-5" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path fill="#EA4335"
                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4"
                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05"
                        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                    <path fill="#34A853"
                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                </svg>
                Entrar com Google
            </button>

            <a href="index.html" class="block mt-6 text-sm text-iffar hover:underline">
                Voltar para a página inicial
            </a>
        </div>

        <p class="text-xs text-gray-400 text-center mt-6">
            Ao entrar você concorda que esta é uma versão em testes, em avaliação pela equipe do projeto.
        </p>
    </div>

    <script>
        document.getElementById('btn-google').addEventListener('click', function () {
            // v1: apenas marca como logado e segue para a ferramenta.
            // A integração real com o Google (OAuth) entra em uma próxima versão.
            localStorage.setItem('presente_auth', '1');
            localStorage.setItem('presente_auth_ts', String(Date.now()));
            location.href = 'presente.html';
        });
    </script>

</body>

</html>
