<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>presente.edu - Solicitações de acesso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .bg-iffar {
            background-color: #32a041;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth-common.js"></script>
    <script>
        firebase.initializeApp(window.FIREBASE_CONFIG);
        // const API_URL = "http://127.0.0.1:5001";
        const API_URL = "https://conta-faltas.vercel.app";
    </script>
</head>

<body class="bg-gray-50 min-h-screen">

    <div class="max-w-3xl mx-auto px-6 py-10">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-extrabold text-gray-900">Solicitações de acesso</h1>
                <p class="text-sm text-gray-500">Aprove ou recuse pedidos de coordenadores para usar o
                    presente.edu.</p>
            </div>
            <div class="flex items-center gap-4">
                <a href="presente.html" class="text-sm text-iffar hover:underline">Voltar à ferramenta</a>
                <button onclick="sairDaConta()" class="text-sm text-gray-500 hover:underline">Sair</button>
            </div>
        </div>

        <div id="bloco-negado" class="hidden bg-white border border-gray-200 rounded-2xl p-8 text-center">
            <p class="text-lg font-bold text-gray-900 mb-1">Acesso restrito</p>
            <p class="text-sm text-gray-500">Esta página é só para administradores.</p>
        </div>

        <div id="bloco-carregando" class="text-sm text-gray-400">Carregando solicitações...</div>

        <div id="bloco-vazio" class="hidden bg-white border border-gray-200 rounded-2xl p-8 text-center">
            <p class="text-sm text-gray-500">Nenhuma solicitação pendente no momento. 🎉</p>
        </div>

        <div id="lista-solicitacoes" class="space-y-4"></div>
    </div>

    <!-- Modal do comprovante -->
    <div id="modal-comprovante"
        class="hidden fixed inset-0 z-[80] bg-black/60 items-center justify-center p-4"
        onclick="if (event.target === this) fecharComprovante()">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] overflow-auto p-4">
            <div class="flex justify-end mb-2">
                <button onclick="fecharComprovante()" class="text-sm text-gray-500 hover:text-gray-800">Fechar
                    ✕</button>
            </div>
            <div id="comprovante-conteudo" class="text-center text-sm text-gray-400 py-10">Carregando...</div>
        </div>
    </div>

    <script>
        function cardSolicitacao(s) {
            const criado = s.criado_em ? new Date(s.criado_em._seconds * 1000).toLocaleString('pt-BR') : '';
            return `
            <div class="bg-white border border-gray-200 rounded-2xl p-6" id="card-${cssEsc(s.email)}">
                <div class="flex items-start justify-between gap-4 flex-wrap">
                    <div>
                        <p class="font-bold text-gray-900">${escapeHtml(s.nome || '(sem nome)')}</p>
                        <p class="text-sm text-gray-500">${escapeHtml(s.email)}</p>
                        <p class="text-sm text-gray-700 mt-1"><strong>Curso:</strong> ${escapeHtml(s.curso || '—')}</p>
                        ${criado ? `<p class="text-xs text-gray-400 mt-1">Solicitado em ${criado}</p>` : ''}
                    </div>
                    <div class="flex flex-col gap-2 items-end shrink-0">
                        ${s.tem_comprovante
                    ? `<button onclick="verComprovante('${cssEsc(s.email)}')" class="text-sm text-iffar hover:underline">Ver comprovante</button>`
                    : `<span class="text-xs text-gray-400">Sem comprovante</span>`}
                        <div class="flex gap-2">
                            <button onclick="decidir('${cssEsc(s.email)}', 'aprovar', this)"
                                class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
                                Aprovar
                            </button>
                            <button onclick="decidir('${cssEsc(s.email)}', 'rejeitar', this)"
                                class="bg-red-100 hover:bg-red-200 text-red-700 text-sm font-semibold px-4 py-2 rounded-lg transition">
                                Recusar
                            </button>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }
        function cssEsc(s) { return String(s).replace(/'/g, "\\'"); }

        async function carregarSolicitacoes() {
            document.getElementById('bloco-carregando').classList.remove('hidden');
            document.getElementById('bloco-vazio').classList.add('hidden');
            try {
                const res = await apiFetch(`${API_URL}/admin/pendentes`);
                if (res.status === 403) {
                    document.getElementById('bloco-negado').classList.remove('hidden');
                    return;
                }
                const json = await res.json();
                if (!res.ok) throw new Error(json.erro || 'Erro ao carregar solicitações.');

                const lista = document.getElementById('lista-solicitacoes');
                if (!json.solicitacoes.length) {
                    document.getElementById('bloco-vazio').classList.remove('hidden');
                    lista.innerHTML = '';
                    return;
                }
                lista.innerHTML = json.solicitacoes.map(cardSolicitacao).join('');
            } catch (e) {
                document.getElementById('lista-solicitacoes').innerHTML =
                    `<p class="text-sm text-red-600">${escapeHtml(e.message)}</p>`;
            } finally {
                document.getElementById('bloco-carregando').classList.add('hidden');
            }
        }

        async function decidir(email, decisao, btn) {
            const card = document.getElementById('card-' + cssEsc(email));
            const botoes = card.querySelectorAll('button');
            botoes.forEach(b => b.disabled = true);
            try {
                const res = await apiFetch(`${API_URL}/admin/decidir`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, decisao }),
                });
                const json = await res.json();
                if (!res.ok) throw new Error(json.erro || 'Erro ao registrar decisão.');
                card.remove();
                if (json.email_enviado === false) {
                    alert(`Decisão registrada, mas o e-mail para ${email} não foi enviado ` +
                        '(verifique SMTP_USER/SMTP_PASSWORD na API). Avise a pessoa manualmente.');
                }
                const lista = document.getElementById('lista-solicitacoes');
                if (!lista.children.length) document.getElementById('bloco-vazio').classList.remove('hidden');
            } catch (e) {
                alert(e.message);
                botoes.forEach(b => b.disabled = false);
            }
        }

        async function verComprovante(email) {
            const modal = document.getElementById('modal-comprovante');
            const conteudo = document.getElementById('comprovante-conteudo');
            conteudo.textContent = 'Carregando...';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            try {
                const res = await apiFetch(`${API_URL}/admin/comprovante/${encodeURIComponent(email)}`);
                const json = await res.json();
                if (!res.ok) throw new Error(json.erro || 'Erro ao carregar comprovante.');
                const dataUrl = json.comprovante_base64 || '';
                if (dataUrl.startsWith('data:application/pdf')) {
                    conteudo.innerHTML = `<embed src="${dataUrl}" type="application/pdf" class="w-full h-[70vh]" />`;
                } else if (dataUrl.startsWith('data:image/')) {
                    conteudo.innerHTML = `<img src="${dataUrl}" class="max-w-full mx-auto rounded-lg" />`;
                } else {
                    conteudo.textContent = 'Não foi possível exibir este arquivo.';
                }
            } catch (e) {
                conteudo.textContent = e.message;
            }
        }

        function fecharComprovante() {
            const modal = document.getElementById('modal-comprovante');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharComprovante();
        });

        (async () => {
            const user = await exigirLogin('auth.html');
            if (!user) return;
            await carregarSolicitacoes();
        })();
    </script>

</body>

</html>
