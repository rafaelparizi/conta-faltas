# Config do nginx só para desenvolvimento local (docker-compose).
# Sem Cache-Control, o navegador aplica cache heurístico e pode servir uma
# versão ANTIGA de um .html/.js sem nem consultar o servidor — em dev isso
# faz mudanças parecerem não ter efeito. Aqui forçamos revalidação sempre.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
